aid: aerska
name: Aerska
description: >-
  Aerska is a biotechnology company developing RNA interference (RNAi) medicines
  to treat, delay, and prevent diseases of the brain and central nervous system.
  The company pairs next-generation RNAi therapeutics with receptor-mediated
  "brain shuttle" delivery technology engineered to cross the blood-brain barrier
  and silence disease-causing genes in the CNS. Founded in 2025 by Jack O'Meara,
  Stuart Milstein, and Dave Hardwicke, Aerska is headquartered in Dublin, Ireland
  with research operations in London. It emerged from stealth in 2026 having
  raised a Series A round led by the EQT Dementia Fund and age1, with additional
  backing from Speedinvest and Backed. Aerska is a pre-clinical drug-discovery
  company and does not currently publish a public developer API or platform.
